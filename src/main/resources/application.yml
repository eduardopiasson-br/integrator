spring:
  application:
    name: activation-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade do Flyway; o Hibernate apenas confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  web:
    locale: pt_BR          # mensagens de validação sempre em pt-BR, independentemente do Accept-Language
    locale-resolver: fixed

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
